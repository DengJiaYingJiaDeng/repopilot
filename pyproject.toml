[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.7.0"
description = "Repository retrieval and bounded issue investigation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
openai = ["openai>=1.0,<3", "httpx[socks]>=0.27,<1"]
local = ["sentence-transformers>=5.1,<6", "transformers>=4.51,<5"]
mcp = ["mcp>=2,<3"]
graph = ["langgraph>=1,<2"]
dev = [
  "mcp>=2,<3",
  "langgraph>=1,<2",
  "httpx>=0.27,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
addopts = "--cov=repopilot --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["repopilot"]
strict = true
